upstream ai_platform_frontend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;

    server_name ai-automation-platform.com;

    return 301 https://ai-automation-platform.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name www.ai-automation-platform.com;

    return 301 https://ai-automation-platform.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.ai-automation-platform.com;

    ssl_certificate /etc/nginx/ssl/frontend-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/frontend-origin.key;

    return 301 https://ai-automation-platform.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ai-automation-platform.com;

    ssl_certificate /etc/nginx/ssl/frontend-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/frontend-origin.key;

    client_max_body_size 100m;

    location / {
        proxy_pass http://ai_platform_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /static/ {
        proxy_pass http://ai_platform_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://ai_platform_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
