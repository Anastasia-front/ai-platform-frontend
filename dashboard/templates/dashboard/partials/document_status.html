{% if document %}
<span
    id="document-status-{{ document.id }}"
    class="status-badge status-{{ document.status }}"
    data-document-status
    data-document-id="{{ document.id }}"
    data-document-has-text="{% if document.text %}true{% else %}false{% endif %}"
    {% if document.status in active_statuses %}
    hx-get="{% url 'dashboard:document_status_partial' document_id=document.id %}"
    hx-trigger="every 3s"
    hx-swap="outerHTML"
    {% endif %}
>{{ document.status }}{% if document.text %} · text ready{% elif document.status in active_statuses %} · processing…{% else %} · needs processing{% endif %}</span>
{% if document.processing_error %}
<span class="muted document-status-error">{{ document.processing_error }}</span>
{% endif %}
{% else %}
<span class="status-badge status-unknown">unavailable</span>
{% endif %}
